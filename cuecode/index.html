<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuecode</title>
  <meta name="description" content="Learn to code with cue cards, side-by-side languages and plain-word docs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='19' rx='3' fill='%23fffdf8' stroke='%23b8441f' stroke-width='2'/%3E%3Cpath d='M3 13h26' stroke='%23b8441f' stroke-width='2'/%3E%3C/svg%3E">
  <script>
    // Set the saved theme before the first paint, so dark mode doesn't flash.
    try {
      const saved = JSON.parse(localStorage.getItem('cuecode.v1') || '{}').theme;
      if (saved) document.documentElement.dataset.theme = saved;
    } catch { /* private window: fall back to the system setting */ }
  </script>
  <link rel="stylesheet" href="app/styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:2rem">Cuecode needs JavaScript to run.</p></noscript>
  <script src="app/data.js"></script>
  <script src="app/highlight.js"></script>
  <script src="app/srs.js"></script>
  <script src="app/finder-data.js"></script>
  <script src="app/finder.js"></script>
  <script src="app/main.js"></script>
</body>
</html>
