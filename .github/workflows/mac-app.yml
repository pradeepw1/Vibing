name: Mac app

# Builds "Solar System Live.app" (one app for Apple-chip and Intel Macs) and checks that it starts.
# The disk image and the zip are kept with the run, under "Artifacts".
on:
  push:
    paths:
      - "solar-wallpaper/mac/**"
      - "solar-wallpaper/dist/**"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: ARCHS="arm64 x86_64" solar-wallpaper/mac/build.sh dmg zip

      - name: Look at what was built
        run: |
          app="solar-wallpaper/mac/build/Solar System Live.app"
          lipo -info "$app/Contents/MacOS/SolarSystemLive"
          codesign -dv "$app" 2>&1 | head -5
          test -f "$app/Contents/Resources/web/index.html"
          test -f "$app/Contents/Resources/web/scope.html"
          test -f "$app/Contents/Resources/AppIcon.icns"
          du -sh "$app" solar-wallpaper/mac/build/SolarSystemLive.dmg solar-wallpaper/mac/build/SolarSystemLive.zip

      - name: Start it and check it draws, takes the menu's choices, saves power
        run: |
          app="solar-wallpaper/mac/build/Solar System Live.app"
          SSL_SNAPSHOT="$PWD/snapshot.png" "$app/Contents/MacOS/SolarSystemLive" > run.log 2>&1 &
          pid=$!
          sleep 50
          screencapture -x screen.png || true
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 50 seconds."
            kill "$pid"
          else
            echo "It stopped by itself:"
            cat run.log
            exit 1
          fi
          cat run.log
          check() { grep -q "$1" run.log || { echo "MISSING in the log: $1"; failed=1; }; }
          failed=0
          # Space Scope is what the wallpaper shows when the app starts, as a wallpaper: the savings are on, no settings button.
          check 'page state (scope): .*"page":true.*"which":"scope".*"saver":true.*"settingsButton":false'
          check 'launch check: menu: .*Look at (now Out to Jupiter)'
          check 'after picking the Inner planets view the page says: inner'
          # Switching to the lean picture and zooming it from the menu.
          check 'style now: lean'
          check 'page state (lean): .*"page":true.*"which":"lean".*"settingsButton":false'
          check 'after picking 4x in the menu the page says: 4.0× · Out to Mars'
          # While hushed (screen asleep, locked, screen saver) the window is off the screen and the page draws nothing, and it comes back when woken.
          check 'while hushed, the page saw and drew: .*"drawsWhileHushed":0'
          check 'while hushed, the page saw and drew: .*"drawsInAll":[1-9]'
          # The frame rate for each situation.
          check 'frame rate scope, plugged in: 30'
          check 'frame rate scope, battery, save power: 20'
          check 'frame rate scope, battery, pause: paused'
          check 'frame rate scope, low power mode: 12'
          check 'frame rate lean, plugged in: 20'
          check 'frame rate lean, battery, save power: 15'
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: SolarSystemLive-mac
          path: |
            solar-wallpaper/mac/build/SolarSystemLive.dmg
            solar-wallpaper/mac/build/SolarSystemLive.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check
          path: |
            screen.png
            snapshot.png
            run.log
          if-no-files-found: ignore
