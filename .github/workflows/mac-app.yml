name: Mac app

# Builds "Solar System Live.app" (one app for Apple-chip and Intel Macs) and checks that it starts.
# The disk image and the zip are kept with the run, under "Artifacts".
on:
  push:
    paths:
      - "solar-wallpaper/mac/**"
      - "solar-wallpaper/dist/**"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15 # (GitHub retired its macOS 14 machines in November 2026)
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: ARCHS="arm64 x86_64" solar-wallpaper/mac/build.sh dmg zip

      - name: Look at what was built
        run: |
          app="solar-wallpaper/mac/build/Solar System Live.app"
          lipo -info "$app/Contents/MacOS/SolarSystemLive"
          codesign -dv "$app" 2>&1 | head -5
          test -f "$app/Contents/Resources/web/index.html"
          test -f "$app/Contents/Resources/web/scope.html"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -f "$app/Contents/Resources/web/facts.js" # (the menu's sky facts)
          du -sh "$app" solar-wallpaper/mac/build/SolarSystemLive.dmg solar-wallpaper/mac/build/SolarSystemLive.zip

      - name: Check the screen saver loads
        run: |
          saver="solar-wallpaper/mac/build/Solar System Live.saver"
          lipo -info "$saver/Contents/MacOS/SolarSaver"
          file "$saver/Contents/MacOS/SolarSaver" | grep -q "bundle" || { echo "::error::the screen saver isn't a loadable bundle"; exit 1; }
          codesign --verify --deep --strict "$saver"
          test -f "$saver/Contents/Resources/web/scope.html"
          # Loaded the way macOS loads a screen saver: the bundle, then the view it names.
          cat > loadsaver.swift <<'EOF'
          import Foundation
          import ScreenSaver
          guard let bundle = Bundle(path: CommandLine.arguments[1]), bundle.load(),
                let view = bundle.principalClass as? ScreenSaverView.Type else {
              print("::error::the screen saver didn't load")
              exit(1)
          }
          print("::notice::the screen saver loads: \(view)")
          EOF
          swiftc -o loadsaver loadsaver.swift
          ./loadsaver "$saver"
          du -sh "$saver" solar-wallpaper/mac/build/SolarSystemLive-ScreenSaver.zip

      - name: Start it and check it draws, takes the menu's choices, saves power
        run: |
          app="solar-wallpaper/mac/build/Solar System Live.app"
          SSL_SNAPSHOT="$PWD/snapshot.png" "$app/Contents/MacOS/SolarSystemLive" > run.log 2>&1 &
          pid=$!
          # The app walks through its check (five minutes or so; longer on a slow machine) and says when it is done.
          for i in $(seq 1 480); do
            grep -q "launch check: finished" run.log && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          sleep 3 # (the last answers from the page)
          screencapture -x screen.png || true
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running at the end of the check."
            kill "$pid"
          else
            echo "It stopped by itself:"
            cat run.log
            exit 1
          fi
          cat run.log
          # (::error:: and ::notice:: lines show on the run's page, which anyone can read; its log takes signing in.)
          check() { grep -q "$1" run.log || { echo "::error::MISSING in the log: $1"; failed=1; }; }
          failed=0
          # Space Scope is what the wallpaper shows when the app starts, as a wallpaper: the savings are on, no settings button.
          check 'page state (scope): .*"page":true.*"which":"scope".*"saver":true.*"settingsButton":false'
          # The menu: tonight's Moon and the next eclipse, the few things done often, and the rest in Settings.
          check 'launch check: menu: .*% | Next eclipse .* | - | Open Space Scope… | Look at \[Out to Jupiter\] | Pause | - | Settings[^|]* | Quit   \['
          check 'launch check: settings menu: Picture \[Space Scope\] | Time speed \[Live\] | Show \[Names\] | - | Camera goes round | .* | Solar System Live 1.0 ([0-9a-f]\{7,\}, 20[0-9-]* [0-9:]*)   \['
          check 'after picking the Inner planets view the page says: inner'
          # Switching to the lean picture and zooming it from the menu.
          check 'style now: lean'
          check 'page state (lean): .*"page":true.*"which":"lean".*"settingsButton":false'
          check 'after picking 4x in the menu the page says: 4.0× · Out to Mars'
          # While hushed (screen asleep, locked, screen saver) the window is off the screen and the page draws nothing, and it comes back when woken.
          check 'while hushed, the page saw and drew: .*"seen":\["hidden","visible"\].*"drawsWhileHushed":0.*"msHushed":[1-9][0-9][0-9][0-9]'
          check 'launch check: finished'
          # Out to a galaxy and home again, each one move: never dark, the camera seen drawing back from the solar system (and
          # never nearer again) on the way out, coming in from far out (and only ever nearer) on the way home, and at the end
          # everything as a jump there would leave it.
          check 'home from a galaxy, the Space Scope window: {"darkestOut":0,"drewBack":true,"outCameBack":0,"stage":null,"darkest":0,"flewIn":true,"turnedBack":0,"home":true,"names":"","leftOver":false}'
          grep 'home from a galaxy' run.log | tail -1 | while read -r line; do echo "::notice::$line"; done
          # What the Space Scope window is left showing becomes the wallpaper; Reset puts it back.
          check 'after setting up Saturn in the Space Scope window, the wallpaper shows: {"view":"saturn","drift":false,"cam":\[6,3,8\],"camNow":\[6,3,8\]}'
          # And out by a black hole, close in: the angle it was left at, not the black hole's own framing.
          check 'after setting up Cygnus X-1 in the Space Scope window, the wallpaper shows: {"view":"galaxy-cygx1","stage":"there","cam":\[0.0041,0.0087,-0.0059\],"camNow":\[0.0041,0.0087,-0.0059\]}'
          check 'after Reset, the wallpaper shows: {"view":"middle","drift":[a-z]*,"cam":null'
          # Other apps opening and Mission Control: the same page carries on, its graphics kept, nothing reloaded by the app.
          awk '/watching the wallpaper/{f=1} /after other apps and Mission Control/{print; f=0} f' run.log > apps.log
          cat apps.log
          check 'after other apps and Mission Control, the wallpaper page: {"samePage":true,.*"lost":0,"back":0'
          if grep -q 'the page loaded\|the page stopped\|graphics were lost\|made again' apps.log; then echo "::error::WRONG: the wallpaper restarted while other apps opened"; failed=1; fi
          # Started with the desktop already covered: the page still loads, hidden, so uncovering it shows the finished picture.
          check 'started under a cover, a minute on, the page: {"visibility":"hidden","loaded":true,"drawn":[1-9]'
          check 'uncovered, the page: {"visibility":"visible","loaded":true,"drawn":[1-9]'
          # It loaded on show, not hidden: a hidden page puts nothing on the screen, so only then is its picture ready under the cover.
          awk '/started the pictures again under the cover/{f=1} /a minute on, the page/{f=0} f' run.log > covered.log
          grep 'finished loading\|a minute on\|uncovered, the page' run.log | tail -6 | while read -r line; do echo "::notice::$line"; done
          grep -q 'page: finished loading' covered.log || { echo "::error::WRONG: the page didn't finish loading under the cover"; failed=1; }
          if grep -q 'finished loading, covered' covered.log; then echo "::error::WRONG: the page was hidden while it loaded under the cover"; failed=1; fi
          # The Low Power Mode signal comes on a background thread: the app takes it on the main one, and doesn't crash.
          check 'the Low Power Mode setting changed'
          # A page that keeps stopping: after three times the screen gets the lean picture, instead of reloading for ever.
          check 'third time: stopped the page'
          check 'Space Scope keeps stopping on a screen: showing the lean picture there'
          check 'page state (after the picture kept stopping): .*"which":"lean","fps":20'
          # Told five times that the screens changed when nothing did: one quiet note, nothing made again, nothing reloaded.
          awk '/told the app five times that the screens changed/{f=1} /four seconds after/{f=0} f' run.log > screens.log
          cat screens.log
          [ "$(grep -c 'nothing about them did' screens.log)" = 1 ] || { echo "::error::WRONG: expected one quiet note about the screens"; failed=1; }
          if grep -q 'the page loaded\|made again\|making a window' screens.log; then echo "::error::WRONG: the wallpapers were made again or reloaded"; failed=1; fi
          # Another window over the whole desktop: the page is told it is hidden, draws nothing, and draws again after.
          check 'while another window covered the desktop, the page drew: .*"drawsWhileCovered":0,"seenWhileCovered":\["hidden","visible"\],"msCovered":[1-9][0-9][0-9][0-9],"drawsAfter":[1-9]'
          check 'while hushed, the page saw and drew: .*"drawsInAll":[1-9]'
          # The Mac's own signals: the screen going to sleep, the Mac locking, the screen saver.
          for reason in sleep locked screensaver; do check "hushed for $reason"; check "woken from $reason"; done
          # The frame rate for each situation.
          check 'frame rate scope, plugged in: 30'
          check 'frame rate scope, battery, save power: 20'
          check 'frame rate scope, battery, pause: paused'
          check 'frame rate scope, low power mode: 12'
          check 'frame rate lean, plugged in: 20'
          check 'frame rate lean, battery, save power: 15'
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: SolarSystemLive-mac
          path: |
            solar-wallpaper/mac/build/SolarSystemLive.dmg
            solar-wallpaper/mac/build/SolarSystemLive.zip
            solar-wallpaper/mac/build/SolarSystemLive-ScreenSaver.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check
          path: |
            screen.png
            snapshot.png
            run.log
          if-no-files-found: ignore
